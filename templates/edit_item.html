{% extends "base.html" %}

{% block title %}Edit listing — AnyRent{% endblock %}

{% block content %}
<div class="page-wrap">
    <main class="container">
        <h1>Edit listing</h1>
        <form action="{{ url_for('profile.edit_item', item_id=item.id) }}" method="POST" enctype="multipart/form-data" novalidate>
            <div class="field">
                <label for="item_name">Item name *</label>
                <input id="item_name" name="name" type="text" value="{{ item.name }}" required>
            </div>
            <div class="field">
                <label for="item_category">Category</label>
                <input id="item_category" name="category" type="text" value="{{ item.category }}">
            </div>
            <div class="field">
                <label for="item_type">Type</label>
                <input id="item_type" name="type" type="text" value="{{ item.type }}">
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="item_price">Price per day (Rs)</label>
                    <input id="item_price" name="price" type="number" value="{{ item.price }}" min="1">
                </div>
                <div class="field">
                    <label for="item_deposit">Deposit (Rs)</label>
                    <input id="item_deposit" name="deposit" type="number" value="{{ item.deposit }}" min="0">
                </div>
                <div class="field">
                    <label for="item_quantity">Quantity in stock</label>
                    <input id="item_quantity" name="quantity" type="number" value="{{ item.quantity }}" min="1">
                </div>
            </div>
            <div class="field">
                <label for="item_location">Location</label>
                <input id="item_location" name="location" type="text" value="{{ item.location }}">
            </div>
            <div class="field">
                <label for="item_image">Image URL</label>
                <input id="item_image" name="image" type="url" value="{{ item.image }}">
            </div>
            <div class="field">
                <label for="item_video">Showcase video</label>
                <input id="item_video" name="video" type="file" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-m4v" class="video-input">
                <span class="field-hint">MP4, WebM, OGG, MOV or M4V · max ~120 MB. Upload a new file to replace the current one.</span>
                {% if item.video %}
                    <video class="video-preview" src="{{ url_for('static', filename='uploads/' + item.video) }}" controls muted playsinline></video>
                {% endif %}
                <video id="video-preview" class="video-preview hidden" controls muted playsinline></video>
            </div>
            <div class="field">
                <label for="item_desc">Description</label>
                <textarea id="item_desc" name="description" rows="4">{{ item.description }}</textarea>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Submit changes for review</button>
                <a class="btn btn-ghost" href="{{ url_for('profile.profile') }}">Cancel</a>
            </div>
        </form>
    </main>
</div>
{% endblock %}

{% block scripts %}
    <script>
        const editVideoInput = document.getElementById('item_video');
        const editVideoPreview = document.getElementById('video-preview');
        if (editVideoInput && editVideoPreview) {
            editVideoInput.addEventListener('change', function () {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (e) {
                    editVideoPreview.src = e.target.result;
                    editVideoPreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            });
        }
    </script>
{% endblock %}
